name: Android test APK (Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-test-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Build standalone release APK for testing
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: invoice-maker-android-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

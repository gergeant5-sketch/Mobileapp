name: Check mobile and server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo mobile TypeScript
        run: npm run typecheck:mobile
      - name: Check Next.js TypeScript
        run: npm run typecheck:server
      - name: Build Next.js download site
        run: npm run build:server
